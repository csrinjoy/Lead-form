<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unlimited Contact & Lead Capture Form</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-slate-800 border border-slate-700 rounded-2xl p-8 shadow-2xl">
        <div class="text-center mb-6">
            <div class="w-12 h-12 bg-yellow-500 rounded-full mx-auto flex items-center justify-center text-slate-900 text-xl font-bold mb-3 shadow">
                <i class="fa-solid fa-envelope-circle-check"></i>
            </div>
            <h1 class="text-2xl font-black text-yellow-400">Get In Touch</h1>
            <p class="text-xs text-slate-400 mt-1">Fill out the details below. Unlimited submissions enabled.</p>
        </div>

        <!-- FormSubmit Action pointing to your email -->
        <form action="https://formsubmit.co/srinjoyamazon27@gmail.com" method="POST" class="space-y-4">
            
            <!-- Optional: Disable Captcha and redirect back or show success -->
            <input type="hidden" name="_template" value="table">

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Full Name</label>
                <input type="text" name="name" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-yellow-400" placeholder="John Doe">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Phone Number</label>
                <input type="tel" name="phone" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-yellow-400" placeholder="(555) 000-0000">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Email Address</label>
                <input type="email" name="email" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-yellow-400" placeholder="john@example.com">
            </div>

            <button type="submit" class="w-full bg-yellow-500 hover:bg-yellow-400 text-slate-900 font-bold py-3 px-4 rounded-xl shadow-lg transition flex items-center justify-center gap-2 text-sm mt-2">
                <i class="fa-solid fa-paper-plane"></i> Submit Details
            </button>
        </form>
    </div>

</body>
</html>
